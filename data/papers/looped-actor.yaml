id: looped-actor
name: Looped Actor
title: "Looped Actor: Depth-Recurrent Reasoning Models for Reinforcement Learning"
arxiv: "2609.37432"
published: 2026-09-29
authors:
  - T. Konstantin Rusch
  - Tim Seyde
  - Jared Boyer
  - Zach J. Patterson
