id: convergence-selection
name: Convergence Selection
title: When Does Recurrence Become an Algorithm? Convergence Selection in Weight-Tied Looped Transformers
arxiv: "2607.20594"
published: 2026-07-22
authors:
  - Tong Zhang
  - Junhao Hu
  - Yun Peng
  - Tao Xie
group: core
summary: Studies when a weight-tied looped transformer implements a real algorithm on group word problems. Training installs a linear computation frontier whose speed is set by the training contract, and weight tying, not expressivity, makes the model choose a serial algorithm over a parallel scan.
diagram: "[ One block ] × T  → frontier solving v positions per loop"
depth: Principled halting rule T* = ⌈n / v⌉
kv: See paper
notes: Frontier speed follows v ~ n_train / T_train (R² = 0.99). A5 generalizes fully while S5 stalls unless trained operator-first. Introduces a convergence-time instrument because standard probes saturate at fixed points.
