summary: Studies learned memory tokens as a scratchpad for a single-block Universal Transformer with ACT on Sudoku-Extreme, finding them necessary and showing that memory size and ponder depth substitute for each other at fixed accuracy.
diagram: "[ Single block + memory tokens ] × r (ACT halting)"
depth: Adaptive Computation Time
kv: Learned memory tokens
notes: No configuration without memory tokens works; 8–32 tokens reach 57.4% exact match. Identifies an ACT router initialization trap and fixes it with a negative bias ('deep start'); ACT then has far lower seed variance than fixed depth.
