id: truncate-or-not
name: Truncate or Not?
title: Truncate or Not? A Scaling Study of Looped Transformers with Truncated Backpropagation
arxiv: "2610.26030"
published: 2026-10-19
authors:
  - Xuyuan Xiong
  - Siyu Chen
  - Zihan Shao
  - Yue Su
  - Weiyang Jin
  - Ping Luo
  - Zhuoran Yang
  - Xihui Liu
group: core
summary: A scaling study of truncated backpropagation through time in prelude–recurrent–coda looped transformers. Nearly 600 runs jointly vary model size, tokens and forward/backward loop counts, and a unified law expresses looping and truncation through effective parameters.
diagram: Prelude → [ Recurrent block ] × T (backprop through last B) → Coda
depth: Fixed forward loops T with B backward loops
kv: See paper
notes: When forward and backward loop counts are optimized jointly, the law favors full BPTT; in matched-compute runs, full BPTT through fewer loops beats truncation. Two fully trained loops beat the compute-optimal non-looped model with about 27% fewer non-embedding parameters and 8% more training compute.
