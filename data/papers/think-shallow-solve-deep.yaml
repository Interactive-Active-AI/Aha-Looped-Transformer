  - theory
summary: Shows that a trained recurrent operator's finite-time dynamical regime, estimated as settling, marginal or drifting, predicts whether extra test-time iterations help, preserve or hurt answers, and gives a sufficient condition for depth safety.
diagram: "[ Operator ] × r  → regime: settling / marginal / drifting"
depth: Test-time depth beyond training
kv: See paper
notes: Settling operators do not degrade with depth, and on Sudoku accuracy rises from 0.19 to 0.34 past the training horizon. A terminal fixed-point objective controls the regime; Huginn-3.5B falls in the non-settling family.
