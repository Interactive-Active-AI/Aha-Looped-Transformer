id: one-model-two-paths
name: One Model, Two Paths
title: "One Model, Two Paths: Balancing Single-Pass and Looped Performance in Language Models"
arxiv: "2610.33517"
published: 2026-10-24
authors:
  - Jiarun Shen
  - Lei Zhao
  - Xiao Li
group: core
topics:
