summary: Removes the sequential latency of looping with Cross-Loop Parallelism, which computes different loops for different tokens in the same pass, and controls memory by sharing the first loop's KV cache with later loops combined through gated sliding-window attention.
diagram: "Token t: loop 1 ‖ token t−1: loop 2 ‖ … in one pass; shared KV + gated SWA"
depth: Fixed loops executed in parallel across tokens
kv: First-loop KV shared across loops plus gated sliding-window attention
notes: Reports looped-model accuracy with almost no extra latency or memory over a standard transformer. LoopCoder-v2 later trains 7B PLT coders and finds two loops optimal.
