summary: "Teaches language models to ponder in continuous space: within one token step, the model feeds back the probability-weighted sum of token embeddings and runs another forward pass, learned through ordinary self-supervised pretraining."
diagram: Forward → expected embedding Σ pᵢ eᵢ → Forward … → token
depth: Fixed pondering steps per token
kv: See paper
notes: Works on GPT-2, Pythia and LLaMA architectures; PonderPythia-2.8B surpasses Pythia-6.9B and rivals Pythia-12B on nine benchmarks.
