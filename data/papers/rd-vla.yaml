id: rd-vla
name: RD-VLA
title: "Recurrent-Depth VLA: Implicit Test-Time Compute Scaling of Vision-Language-Action Models via Latent Iterative Reasoning"
arxiv: "2602.07845"
published: 2026-02-08
authors:
  - Yalcin Tur
  - Jalal Naghiyev
  - Haoquan Fang
  - Wei-Chuan Tsai
  - Jiafei Duan
  - Dieter Fox
  - Ranjay Krishna
group: adaptive
summary: Recurrent-Depth VLA gives vision-language-action models a weight-tied recurrent action head that refines a latent for any number of steps at constant memory, trained with truncated BPTT and stopped adaptively when the latent converges.
diagram: VLM features → [ Weight-tied action head ] × r (stop on convergence) → actions
depth: Adaptive stopping based on latent convergence
kv: Constant memory in recurrence depth
notes: Manipulation tasks that fail completely with one iteration exceed 90% success with four, while simple tasks saturate quickly. Reports up to 80× faster inference than prior reasoning-based VLAs.
code: https://github.com/rd-vla/rd-vla
weights: ""
verified: 2026-10-28
