summary: The Memory-Efficient Looped Transformer keeps one KV cache per layer shared across reasoning loops and updated by a learnable gate, decoupling reasoning depth from memory. It is obtained from Ouro by chunk-wise two-phase post-training with interpolation and attention-aligned distillation.
diagram: "[ Layer ] × R  with one gated KV cache per layer across loops"
depth: Fixed reasoning loops
kv: Single gated KV cache per layer shared across loops
notes: MELT models fine-tuned from Ouro outperform standard LLMs of similar size at a comparable memory footprint, far below Ouro's.
