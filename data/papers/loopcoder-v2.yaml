summary: Trains a family of 7B Parallel Loop Transformer coders with different loop counts from scratch on 18T tokens to study loop-count selection as a gain–cost trade-off between extra refinement and the positional mismatch introduced by cross-loop position offsets.
diagram: "PLT: [ Stack ] × 2 with cross-loop position offsets + shared-KV gated sliding window"
depth: Two loops best; three or more regress
kv: Shared KV with gated sliding-window attention (PLT)
notes: The two-loop model raises SWE-bench Verified from 43.0 to 64.4 and Multi-SWE from 14.0 to 31.0 over the non-looped baseline. Loop 2 provides the main refinement while later loops oscillate.
