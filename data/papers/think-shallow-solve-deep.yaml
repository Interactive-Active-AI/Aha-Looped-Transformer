id: think-shallow-solve-deep
name: Think Shallow, Solve Deep
title: "Think Shallow, Solve Deep: Controlling Recurrent Dynamics for Reliable Test-Time Depth"
arxiv: "2608.18222"
published: 2026-08-18
authors:
  - Ivan Viakhirev
  - Kirill Borodin
  - Amirah Almutairi
  - Serguei Barannikov
  - Maxim Abramov
  - Grach Mkrtchian
group: core
topics:
