group: adaptive
summary: "Brings dynamic looping to reinforcement learning: a transformer policy refines a latent toward a fixed point with a shared block and loops more in states that need planning. A complexity argument shows state-adaptive policies can need less expected computation than any fixed-runtime optimal policy."
diagram: State → [ Shared block ] × r(state) → fixed point → action
depth: State-dependent loop count
kv: Not applicable (policy network)
notes: Across 22 tasks in six environments, online and offline, it matches or beats an untied baseline with 16× more parameters. On Boxoban, loop counts grow with the remaining number of pushes.
