id: asymloop
name: AsymLoop
title: "Asymmetric Looped Transformers: Fixed Global Representations for an Iterative Decoder"
arxiv: "2610.28489"
published: 2026-10-20
authors:
  - Cheng Liang
  - Tengfei Zhang
  - Wenjie DU
  - Jianyu Wu
  - Changlian Ma
