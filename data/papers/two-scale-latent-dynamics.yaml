id: two-scale-latent-dynamics
name: Two-Scale Latent Dynamics
title: Two-Scale Latent Dynamics for Recurrent-Depth Transformers
arxiv: "2509.23314"
published: 2025-09-27
authors:
  - Francesco Pappone
