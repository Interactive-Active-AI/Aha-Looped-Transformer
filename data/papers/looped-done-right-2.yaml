summary: Argues that states near fixed points make the path to them matter less, enabling truncated backprop, terminal KV sharing, faster distilled prefill and cheaper RL updates. It then improves the depth prior, learned from prediction feedback with an entropy term, and introduces orthogonal input injection.
diagram: Prelude → [ Core + orthogonal injection ] × r (learned depth prior) → Coda
depth: Learned depth prior during training
kv: Terminal KV sharing near fixed points
notes: From 100M to 1.6B, the learned prior and orthogonal injection lower perplexity relative to Huginn's prior and existing injection schemes. At 1.6B, a 3× smaller KV cache matches the downstream average of fixed-depth training with a full cache.
