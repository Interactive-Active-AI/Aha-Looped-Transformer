group: core
summary: Scales text-to-image computation by repeating shared Transformer blocks within each denoising step. Deep supervision across intermediate loops and self-modulating attention fix the weak supervision and eroding local detail that make naive looping fail.
diagram: "Each denoising step: [ Shared DiT blocks ] × r  (deep supervision)"
depth: Fixed loops per denoising step
kv: Not applicable (diffusion)
notes: Beats non-looped baselines at matched parameters and compute; a 260M looped model surpasses a 6.5× larger model on several text-to-image benchmarks with 4.9× less inference compute. More loops help more than more denoising steps at a fixed budget.
