id: mimir
name: Mimir
title: "Mimir: A Sub-2B Hierarchical Reasoning Model Trained on Permissible Data Punches Above Its Weight Class"
arxiv: "2608.13517"
published: 2026-08-13
authors:
  - Peter Schneider-Kamp
  - Jacob Nielsen
  - Gianluca Barmina
  - Danial Namazifard
  - Annemette Brok Pirchert
  - Kenneth Enevoldsen
  - Lukas Galke Poech
group: full
topics:
