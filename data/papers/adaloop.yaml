id: adaloop
name: AdaLoop
title: "AdaLoop: Adaptive-Depth Latent Reasoning for Audio Language Models"
arxiv: "2610.06949"
published: 2026-10-03
authors:
  - Lee Seung-woo
  - Bowen Qi
group: adaptive
topics:
