summary: Adapts a pretrained model so it can run either a single pass or a looped pass that reuses its middle layers. Joint weighted losses on both outputs, plus guidance from the frozen original model, stop looped training from degrading single-pass quality.
diagram: "Pretrained stack: single pass ‖ [ Middle layers ] × 2"
depth: "Two inference modes: single-pass or looped"
kv: See paper
notes: Most of the benefit comes from tuning the single-pass loss weight. With validation-selected weights, single-pass quality stays within a preset tolerance of ordinary continued training while looped predictions improve.
