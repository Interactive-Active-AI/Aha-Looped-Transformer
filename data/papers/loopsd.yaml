id: loopsd
name: LoOPSD
title: "LoOPSD: On-Policy Self-Distillation with Looped Teachers"
arxiv: "2610.18162"
published: 2026-10-13
authors:
  - Wei Fan
  - Qingyue Yang
  - Chao-Hong Tan
