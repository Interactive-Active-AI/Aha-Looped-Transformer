summary: Finds that standard LoRA on looped models mostly adapts late loops. Loop Dropout randomly masks adapter applications per loop during training and rescales by inverse survival probability, so the shared update stays strong and effective at every loop.
diagram: "[ Block + LoRA (randomly masked, rescaled) ] × R"
depth: All loops active at inference
kv: See paper
notes: Improves mathematical reasoning across sizes, ranks and recipes, extending to instruction tuning and code. Inference uses standard LoRA at all loops with no extra parameters or compute.
