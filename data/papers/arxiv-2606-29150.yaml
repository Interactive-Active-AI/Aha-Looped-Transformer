summary: Flow Reasoning Models turn a non-causal flow denoiser into a recurrent
  reasoner by feeding its clean-solution prediction back as a conditioning
  state. Fixed-Point Forcing trains the model on states produced by its own
  recurrent rollouts, enabling deeper iterative refinement while retaining the
  standard flow-matching objective.
