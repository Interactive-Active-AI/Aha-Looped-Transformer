id: adaptive-loops-memory
name: Adaptive Loops and Memory
title: "Adaptive Loops and Memory in Transformers: Think Harder or Know More?"
arxiv: "2603.08391"
published: 2026-03-09
authors:
  - Markus Frey
  - Behzad Shomali
  - Ali Hamza Bashir
  - David Berghaus
  - Joachim Koehler
  - Mehdi Ali
group: adaptive
topics:
  - architecture
summary: Combines adaptive per-layer looping, where each block learns to iterate with a halting mechanism, with gated memory banks that add learned storage, to test whether models should think harder or know more.
diagram: "Layer ℓ: [ Block ] × rℓ (halting) + gated memory bank"
depth: Per-layer learned halting
kv: Gated memory banks
notes: Looping mainly helps math while memory recovers commonsense performance; together they beat an iso-FLOP baseline with three times as many layers on math. Early layers loop little and later layers loop and read memory more.
