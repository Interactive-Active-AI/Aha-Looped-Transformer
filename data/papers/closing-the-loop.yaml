notes: The 1.4B LoopLM beats a parameter-matched dense model on all 12 benchmarks with the same data (+14 GSM8K, +10 MATH, +22 DROP) and approaches a 3.9B dense model at matched inference compute. Looped Qwen3-1.7B improves over continued dense training on every benchmark.
