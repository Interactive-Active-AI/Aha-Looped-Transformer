summary: "Combines the YOCO decoder-decoder design with recursion: a Universal Self-Decoder iterates with shared parameters, but only over shallow efficient-attention layers, while YOCO's constant global KV cache and linear prefill stay intact."
diagram: "[ Self-decoder (efficient attention) ] × r → cross-decoder over one global KV cache"
depth: Partial recursion in the self-decoder
kv: Constant global KV cache (YOCO)
notes: Remains competitive on general and long-context benchmarks with better token utility and scaling than either YOCO or recursion alone.
