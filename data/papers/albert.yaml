summary: Reduces BERT's parameters with factorized embeddings and cross-layer parameter sharing, so every layer reuses the same weights, plus an inter-sentence coherence loss.
diagram: Embedding (factorized) → [ Shared encoder layer ] × L
depth: Fixed depth with all layers shared
kv: Not applicable (encoder)
notes: Achieved state-of-the-art GLUE, RACE and SQuAD results with fewer parameters than BERT-large; a canonical example of full-stack weight sharing in pretrained Transformers.
