summary: "Introduces fixed-first training: train a looped model at one fixed depth for most of the run and vary depth only in a short final phase, instead of training across depths from the start."
diagram: Fixed depth (most of training) → mixed depths (finishing phase)
depth: Adaptive inference depth learned late in training
kv: See paper
notes: At 200M, fixed depth 2 for the first 67% cuts modeled training compute by 45% with mean NLL across depths within 0.5%. At 1B, starting at depth 4 cuts compute by 31–37% and wall-clock time by 32–39% with final NLL within 0.8%.
