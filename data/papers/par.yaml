group: adaptive
summary: Progress-Aligned Recurrence makes extra iterations useful for longer state-tracking problems by supervising the prediction at iteration k to match the state after k operations and anchoring recurrent state norms to the first iteration. A learned completion readout decides when to answer.
diagram: Iteration k ≈ state after k operations; norm anchoring; completion readout
depth: Iterations scale with problem length; learned stopping
kv: See paper
notes: A Qwen2.5-0.5B model trained on at most 32 swap-S5 moves reaches 95.5% full-state accuracy at 512 moves. Removing norm anchoring or progress-aligned targets sharply reduces extrapolation. Results cover sequential state-tracking tasks.
