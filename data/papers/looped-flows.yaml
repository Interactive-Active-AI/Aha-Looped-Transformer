id: looped-flows
name: Looped Flows
title: Thinking with Looped Flows
arxiv: "2609.11801"
published: 2026-09-10
authors:
  - Ayhan Suleymanzade
  - Chanhyuk Lee
  - Floor Eijkelboom
  - Nicholas M. Boffi
