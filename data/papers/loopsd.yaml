group: core
summary: Builds a stronger teacher from the same frozen weights by searching which layers to repeat, then distills that looped teacher's predictions on student-generated prefixes back into the student, alternating search and distillation over several rounds.
diagram: Search repeated layers → looped teacher → on-policy distillation → repeat
depth: Teacher repeats searched layers; student runs a single pass
kv: See paper
notes: On GSM8K with a 400-token thinking budget, Qwen3-1.7B rises from 42.30% to 79.61%, with further gains in later rounds. Evaluated on mathematical and logical reasoning tasks.
