id: compute-retain-reuse
name: Compute ≠ Retain ≠ Reuse
title: Learning to Compute Is Not Learning to Retain or Reuse in Looped Transformers
arxiv: "2610.19768"
published: 2026-10-14
authors:
  - Peilong Zhou
  - Hongtao Zhang
  - Yulong Huang
  - Cangyuan Li
  - Mingyu Chen
