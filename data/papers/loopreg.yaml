group: core
summary: A recurrent diffusion Transformer that repeatedly applies a shared block at a state aligned to a pretrained visual encoder after the final recurrent visit, so inference can extend the same operator to additional visits.
diagram: "[ Shared DiT block ] × visits → representation alignment (training)"
depth: Extra inference visits beyond training
kv: Not applicable (diffusion)
notes: On ImageNet 256×256, SiT-B/2 FID drops from 15.08 to 4.91 at 400K steps versus the REG baseline; one extra inference visit on a two-visit checkpoint improves FID from 14.71 to 5.34. Holds for SiT-L/2 and SiT-XL/2.
