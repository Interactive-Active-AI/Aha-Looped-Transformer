summary: Organizes a looped Transformer into begin, middle and end blocks, loops only the middle block, and adds hyper-connections after each loop to expand the residual stream into matrix-valued streams at minimal extra cost.
diagram: Begin block → [ Middle block ] × R (hyper-connections after each loop) → End block
depth: Fixed recurrence
kv: See paper
notes: Performs well against depth-matched Transformer and mHC baselines with about 50% fewer parameters, and the advantage persists after post-training weight quantization.
