id: stochastic-stopping
name: Learned Stochastic Stopping
title: Stabilizing Extrapolation in Looped Transformers via Learned Stochastic Stopping
arxiv: "2606.29983"
published: 2026-06-29
authors:
  - Hsun-Yu Kuo
  - El Mahdi Chayti
  - Patrik Reizinger
  - Wieland Brendel
  - Martin Jaggi
group: adaptive
summary: Traces the brittle length generalization of looped transformers to a spurious correlation between sequence length and loop count, and shows that randomizing loop counts in training, or learning a stochastic schedule with RL-Halting, stabilizes predictions across inference-time loop counts.
diagram: "[ Shared block ] × r,  r sampled (heuristic or RL-Halting) during training"
depth: Stochastic stopping at training time
kv: See paper
notes: On binary addition, Dyck-1, Unique Set and Copy, learned stochastic stopping often improves the accuracy-stability trade-off but can also stabilize a suboptimal computation.
