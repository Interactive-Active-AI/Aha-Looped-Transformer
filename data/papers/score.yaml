summary: Replaces layer stacking with a single shared block applied iteratively through a contractive, ODE-inspired update h ← (1 − dt) · h + dt · F(h), using fixed discrete steps and ordinary backpropagation.
diagram: "[ Single block ] × T:  h ← (1 − dt) h + dt F(h)"
depth: Fixed number of discrete iterations
kv: See paper
notes: Evaluated on graph networks, MLPs and nanoGPT; generally speeds convergence and reduces parameters through sharing. Simple Euler steps give the best cost-performance trade-off.
