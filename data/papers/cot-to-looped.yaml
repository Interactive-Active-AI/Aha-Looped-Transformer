group: full
summary: A theoretical construction of constant-bit-size looped transformers that interpolates between chain-of-thought and latent recurrence, trading generated tokens for loop iterations when simulating Turing machines.
diagram: Looped transformer with L loops + reduced CoT tokens
depth: Prescribed loop count L(n)
kv: Context window O(s(n)/L)
notes: Reduces both context length and generated tokens by a factor of L relative to the unlooped queue-machine simulation, including with softmax attention at constant bit size. Theory only; no trained models.
