group: core
summary: Mid-trains a base model to iterate over a small subset of reasoning-relevant layers, chosen from interpretability evidence, while keeping architecture, parameter count, hyperparameters and data unchanged.
diagram: Encode layers → [ Think layers ] × k → Decode layers
depth: Fixed iterations; adaptive per-token depth explored
kv: See paper
notes: On OLMo-2 1B Base, iterating the selected layers gives +28.4% relative on GSM8K and +36% on MATH, with gains across 17 reasoning benchmarks.
