summary: "A brain-inspired recurrent architecture with two interdependent modules: a slow high-level module for abstract planning and a fast low-level module for detailed computation, solving sequential reasoning tasks in one forward pass without intermediate supervision."
diagram: "[ L-module × T → H-module update ] × N"
depth: Nested two-timescale recurrence
kv: Not applicable (puzzle solver)
notes: With 27M parameters and about 1000 training examples, reports near-perfect results on hard Sudoku and large mazes and strong ARC performance without pretraining or CoT data. Later analyses (for example, Dissecting HRM and TRM) question how much the hierarchy itself contributes.
