id: latent-recurrent-transformer
name: Latent Recurrent Transformer
title: "Latent Recurrent Transformer: Architecture Exploration, Training Strategies, and Scaling Behavior"
arxiv: "2605.26797"
published: 2026-05-26
authors:
  - Zeyi Huang
